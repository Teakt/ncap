default:
  image: python:3.14-slim 

stages:          # l'ordre des étapes du pipeline
  - lint
  - test
  - build-scan-push

variables:
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"

.python-setup: &python-setup     # job "caché" (le point devant = template, non exécuté)
  before_script:
    - cd services/products-api
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
 
lint-job:                          # un nom de job, libre
  stage: lint                      # à quelle étape il appartient        # le conteneur dans lequel il s'exécute
  <<: *python-setup   
  script:                          # les commandes, comme dans ton terminal
    - ruff check app/

test-job:
  stage: test
  <<: *python-setup   
  script:
    - python -m pytest

build-scan-push-job:
  stage: build-scan-push
  image: docker:cli          # le client
  services:
    - docker:dind            # le daemon, à côté
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.72.0    # prépa : l'outil de scan 
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA ./services/products-api
    # 1. Rapport complet, ne casse JAMAIS le job (informatif)
    - trivy image --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # 2. Gate bloquant : SEULEMENT sur CRITICAL, casse le job si trouvé
    - trivy image --severity CRITICAL --exit-code 1 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" 
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA